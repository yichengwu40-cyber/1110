<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>綠建築座位專用燈 - 節能與自動排程儀表板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: { bg: '#08090d', border: 'rgba(0, 243, 255, 0.18)', neonCyan: '#00f3ff' }
                    },
                    boxShadow: { 'neon-cyan': '0 0 20px rgba(0, 243, 255, 0.35)', 'glow-panel': '0 8px 32px 0 rgba(0, 0, 0, 0.6)' }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #08090d; color: #f1f5f9; }
        .font-cyber { font-family: 'Orbitron', sans-serif; }
        .glass-card { background: linear-gradient(135deg, rgba(18, 22, 36, 0.8) 0%, rgba(10, 12, 20, 0.9) 100%); border: 1px solid rgba(0, 243, 255, 0.15); backdrop-filter: blur(12px); border-radius: 1rem; }
        input[type=range] { -webkit-appearance: none; background: #1e293b; border-radius: 8px; height: 8px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 22px; width: 22px; border-radius: 50%; background: #00f3ff; cursor: pointer; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Top Navigation -->
    <header class="border-b border-cyber-border bg-cyber-bg/80 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-cyan-500 to-emerald-500 flex items-center justify-center shadow-neon-cyan">
                    <i data-lucide="leaf" class="w-6 h-6 text-black stroke-[2.5]"></i>
                </div>
                <div>
                    <h1 class="font-cyber font-black text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-emerald-400">
                        GREEN SEAT LIGHT
                    </h1>
                    <p class="text-xs text-slate-400">綠建築座位專用燈與節能計費系統</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button id="connect-btn" onclick="toggleConnection()" class="px-5 py-2.5 rounded-xl font-cyber text-xs sm:text-sm font-bold bg-gradient-to-r from-cyan-500 to-blue-600 text-black hover:scale-105 transition-all shadow-neon-cyan">
                    連線 ESP32 BLE
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: Controls & Schedule -->
        <div class="lg:col-span-7 space-y-8">
            
            <!-- Lighting Control Panel -->
            <section class="glass-card p-6 shadow-glow-panel">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="font-cyber font-bold text-lg text-cyan-400 flex items-center space-x-2">
                        <i data-lucide="sliders-horizontal" class="w-5 h-5"></i>
                        <span>燈光與節能排程控制</span>
                    </h2>
                    <div class="flex items-center space-x-2">
                        <span class="text-xs text-slate-400">排程模式 (Schedule):</span>
                        <input type="checkbox" id="schedule-toggle" onchange="toggleScheduleMode(this.checked)" class="w-5 h-5 accent-cyan-400 cursor-pointer">
                    </div>
                </div>

                <div class="space-y-6">
                    <div>
                        <label class="block text-xs font-cyber text-slate-300 mb-2">自訂 RGB 顏色與手動亮度</label>
                        <div class="flex items-center space-x-4">
                            <input type="color" id="main-color-picker" value="#ff6400" oninput="onColorPickerChange(this.value)" class="w-14 h-12 bg-slate-900 border border-slate-700 rounded-xl cursor-pointer p-1">
                            <div class="flex-1">
                                <div class="flex justify-between text-xs text-slate-400 mb-1">
                                    <span>亮度設定</span>
                                    <span id="bright-val-text" class="text-cyan-400 font-bold">100% (255)</span>
                                </div>
                                <input type="range" id="bright-slider" min="0" max="255" value="255" oninput="onBrightnessChange(this.value)" class="w-full">
                            </div>
                        </div>
                    </div>

                    <!-- Current Schedule Status Badge -->
                    <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 flex items-center justify-between">
                        <div>
                            <span class="text-xs text-slate-400 block">目前生效排程效果</span>
                            <span id="schedule-effect-name" class="font-cyber font-bold text-emerald-400 text-sm">手動控制模式</span>
                        </div>
                        <div class="text-right">
                            <span id="current-time-display" class="font-mono text-xs text-slate-400">--:--:--</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Energy & Cost Calculation Panel -->
            <section class="glass-card p-6 shadow-glow-panel border-emerald-500/30">
                <h2 class="font-cyber font-bold text-lg text-emerald-400 mb-4 flex items-center space-x-2">
                    <i data-lucide="zap" class="w-5 h-5"></i>
                    <span>即時節能與電費計算 (Energy & Cost)</span>
                </h2>
                <div class="grid grid-cols-3 gap-4 text-center">
                    <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-800">
                        <span class="text-[11px] text-slate-400 block">即時消耗功率</span>
                        <span id="power-watt" class="font-cyber font-bold text-xl text-cyan-400">0.0</span> <span class="text-xs text-slate-400">W</span>
                    </div>
                    <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-800">
                        <span class="text-[11px] text-slate-400 block">累積用電度數</span>
                        <span id="energy-kwh" class="font-cyber font-bold text-xl text-emerald-400">0.0000</span> <span class="text-xs text-slate-400">kWh</span>
                    </div>
                    <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-800">
                        <span class="text-[11px] text-slate-400 block">預估電費 (4.5元/度)</span>
                        <span id="cost-ntd" class="font-cyber font-bold text-xl text-yellow-400">$0.00</span> <span class="text-xs text-slate-400">NTD</span>
                    </div>
                </div>
            </section>
        </div>

        <!-- Right Column: Sensors & Logs -->
        <div class="lg:col-span-5 space-y-8">
            <section class="glass-card p-6 shadow-glow-panel">
                <h2 class="font-cyber font-bold text-lg text-cyan-400 mb-6 flex items-center space-x-2">
                    <i data-lucide="activity" class="w-5 h-5"></i>
                    <span>硬體感測器即時監控</span>
                </h2>
                <div class="space-y-4">
                    <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-800 flex justify-between items-center">
                        <span class="text-xs text-slate-300">光敏電阻 LDR (GPIO39)</span>
                        <span id="ldr-val" class="font-cyber font-bold text-yellow-400 text-lg">0</span>
                    </div>
                    <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-800 flex justify-between items-center">
                        <span class="text-xs text-slate-300">可變電阻 Potentiometer</span>
                        <span id="pot-val" class="font-cyber font-bold text-pink-400 text-lg">0</span>
                    </div>
                </div>
            </section>

            <section class="glass-card p-6">
                <h2 class="font-cyber font-bold text-xs text-slate-300 mb-2">藍芽通訊 Log</h2>
                <div id="serial-log" class="bg-black/90 border border-slate-800 rounded-xl p-3 h-32 overflow-y-auto font-mono text-[11px] text-cyan-400 space-y-1">
                    <div>[System] 準備就緒。</div>
                </div>
            </section>
        </div>
    </main>

    <script>
        const SERVICE = "12345678-1234-1234-1234-000000000001";
        const DATA    = "12345678-1234-1234-1234-000000000020";
        const COMMAND = "12345678-1234-1234-1234-000000000030";

        let bleDevice, bleServer, commandChar, dataChar;
        let isScheduleMode = false;
        let accumulatedKWh = 0;
        let lastUpdateTime = Date.now();
        let currentBrightnessPct = 100;

        // 依據你提供的表格建立排程規則
        const scheduleTable = [
            { start: 6,  end: 8,  r: 255, g: 180, b: 100, bright: 60, name: "溫暖晨光 (06:00~08:00)" },
            { start: 8,  end: 12, r: 220, g: 240, b: 255, bright: 100, name: "清爽白光 (08:00~12:00)" },
            { start: 12, end: 16, r: 255, g: 255, b: 255, bright: 100, name: "明亮日光 (12:00~16:00)" },
            { start: 16, end: 18, r: 255, g: 200, b: 120, bright: 70, name: "黃色暖光 (16:00~18:00)" },
            { start: 18, end: 21, r: 255, g: 130, b: 50,  bright: 40, name: "橘黃色光 (18:00~21:00)" },
            { start: 21, end: 23, r: 180, g: 50,  b: 10,  bright: 20, name: "暖橘紅光 (21:00~23:00)" },
            { start: 23, end: 24, r: 80,  g: 10,  b: 0,   bright: 5,  name: "微弱夜間 (23:00~06:00)" },
            { start: 0,  end: 6,  r: 80,  g: 10,  b: 0,   bright: 5,  name: "微弱夜間 (23:00~06:00)" }
        ];

        lucide.createIcons();

        function appendLog(msg) {
            const logBox = document.getElementById('serial-log');
            logBox.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function toggleConnection() {
            if (bleDevice && bleDevice.gatt.connected) {
                bleDevice.gatt.disconnect();
                return;
            }
            try {
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: "41204328" }],
                    optionalServices: [SERVICE]
                });
                bleServer = await bleDevice.gatt.connect();
                let service = await bleServer.getPrimaryService(SERVICE);
                dataChar = await service.getCharacteristic(DATA);
                await dataChar.startNotifications();
                dataChar.addEventListener("characteristicvaluechanged", (e) => {
                    let text = new TextDecoder().decode(e.target.value);
                    try {
                        let json = JSON.parse(text);
                        if(json.l !== undefined) document.getElementById('ldr-val').textContent = json.l;
                        if(json.p !== undefined) document.getElementById('pot-val').textContent = json.p;
                    } catch(err) {}
                });
                commandChar = await service.getCharacteristic(COMMAND);
                document.getElementById('connect-btn').textContent = "已連線 BLE";
                appendLog("BLE 藍牙連線成功！");
            } catch(e) {
                appendLog("連線失敗: " + e.message);
            }
        }

        async function sendCmd(cmd) {
            if (commandChar) {
                await commandChar.writeValue(new TextEncoder().encode(cmd));
                appendLog(`TX: ${cmd}`);
            }
        }

        function toggleScheduleMode(enabled) {
            isScheduleMode = enabled;
            if (enabled) {
                appendLog("已切換至：智慧自動排程模式");
            } else {
                appendLog("已切換至：手動控制模式");
                document.getElementById('schedule-effect-name').textContent = "手動控制模式";
            }
        }

        function onColorPickerChange(hex) {
            if (isScheduleMode) return;
            let rgb = hexToRgb(hex);
            sendCmd(`RGB:${rgb.r},${rgb.g},${rgb.b}`);
        }

        function onBrightnessChange(val) {
            if (isScheduleMode) return;
            currentBrightnessPct = Math.round((val / 255) * 100);
            document.getElementById('bright-val-text').textContent = `${currentBrightnessPct}% (${val})`;
            sendCmd(`BRIGHT:${val}`);
        }

        function hexToRgb(hex) {
            let num = parseInt(hex.replace('#',''), 16);
            return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
        }

        // 每秒更新排程與電費計算
        setInterval(() => {
            let now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            document.getElementById('current-time-display').textContent = 
                String(hours).padStart(2,'0') + ":" + String(minutes).padStart(2,'0') + ":" + String(seconds).padStart(2,'0');

            // 自動排程邏輯
            if (isScheduleMode) {
                let currentActive = scheduleTable.find(s => hours >= s.start && hours < s.end);
                if (currentActive) {
                    document.getElementById('schedule-effect-name').textContent = currentActive.name;
                    currentBrightnessPct = currentActive.bright;
                    // 自動發送排程指令給 ESP32
                    sendCmd(`RGB:${currentActive.r},${currentActive.g},${currentActive.b}`);
                    sendCmd(`BRIGHT:${Math.round(currentActive.bright * 2.55)}`);
                }
            }

            // 電費與耗電量計算 (假設全開 1.8W)
            let nowTime = Date.now();
            let hoursElapsed = (nowTime - lastUpdateTime) / 3600000;
            lastUpdateTime = nowTime;

            let currentPowerW = 1.8 * (currentBrightnessPct / 100);
            accumulatedKWh += (currentPowerW * hoursElapsed) / 1000;
            let estimatedCostNTD = accumulatedKWh * 4.5; // 每度 4.5 元

            document.getElementById('power-watt').textContent = currentPowerW.toFixed(2);
            document.getElementById('energy-kwh').textContent = accumulatedKWh.toFixed(4);
            document.getElementById('cost-ntd').textContent = `$${estimatedCostNTD.toFixed(2)}`;
        }, 1000);
    </script>
</body>
</html>
